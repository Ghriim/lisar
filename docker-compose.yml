services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            APP_ENV: dev
            DATABASE_URL: "mysql://lisar:lisar@mysql:3306/lisar?serverVersion=8.4.0&charset=utf8mb4"
        volumes:
            - .:/var/www/app:cached

    nginx:
        image: nginx:1.27-alpine
        depends_on:
            - app
        ports:
            - "${HTTP_PORT:-8080}:80"
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./public:/var/www/app/public:ro

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: lisar
            MYSQL_USER: lisar
            MYSQL_PASSWORD: lisar
        ports:
            - "${MYSQL_PORT:-3306}:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ulisar", "-plisar"]
            interval: 5s
            timeout: 5s
            retries: 20

    # The test pair is deliberately separate: a test run can never reach the working data.
    app-test:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        depends_on:
            mysql-test:
                condition: service_healthy
        environment:
            APP_ENV: test
            DATABASE_URL: "mysql://lisar:lisar@mysql-test:3306/lisar_test?serverVersion=8.4.0&charset=utf8mb4"
        volumes:
            - .:/var/www/app:cached

    mysql-test:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: lisar_test
            MYSQL_USER: lisar
            MYSQL_PASSWORD: lisar
        # The test database is disposable: keep it in RAM, never in a volume.
        tmpfs:
            - /var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ulisar", "-plisar"]
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    mysql_data:
