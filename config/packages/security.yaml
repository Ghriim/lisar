security:
    # 'auto' picks the best hasher the platform offers (Argon2id through libsodium here), and
    # rehashes on sign-in when that choice changes. Keyed on the interface, so it applies to
    # anything that carries a password — see Infrastructure\Security\PasswordHolder.
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_users:
            id: App\Infrastructure\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api:
            pattern: ^/api
            # No session cookie: every call carries its own access token.
            stateless: true
            provider: app_users
            jwt: ~

    # Only the first matching rule applies.
    access_control:
        # Public: signing up, and everything that hands out or drops a session.
        - { path: ^/api/users/register$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        # The back-office surface, in one place rather than an attribute per route.
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Hashers are resource-intensive by design; the lowest cost keeps the suite fast.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
