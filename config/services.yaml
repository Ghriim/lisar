# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# The entry point for the application's own services. It stays almost empty on purpose:
# everything under src/ is autowired and autoconfigured. See §8 of the backend blueprint.
# Environment-dependent values belong in config.yaml, never here.

imports:
    - { resource: config.yaml }

services:
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Domain/DTO/'
            - '../src/Domain/Registry/'

    Psr\Clock\ClockInterface: '@Symfony\Component\Clock\NativeClock'
    Symfony\Component\Clock\NativeClock: ~
